<section id="after-before" class="section-bg py-6">
  <div class="container-xl">
    <div class="text-center mb-5">
      <h1 class="display-5 text-uppercase">Before <span class="text-primary">&amp; After</span></h1>
      <p class="text-muted">Click any photo to see the before.</p>
    </div>

    <div style="position:relative;">
      <div id="abTrack" class="row g-4"></div>
      <button id="abPrev" aria-label="Previous"
        style="position:absolute;top:50%;left:-20px;transform:translateY(-50%);z-index:10;
               width:44px;height:44px;border-radius:50%;border:none;background:#fff;
               box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:1.4rem;">&#8249;</button>
      <button id="abNext" aria-label="Next"
        style="position:absolute;top:50%;right:-20px;transform:translateY(-50%);z-index:10;
               width:44px;height:44px;border-radius:50%;border:none;background:#fff;
               box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:1.4rem;">&#8250;</button>
    </div>

    <div id="abDots" style="display:flex;justify-content:center;gap:6px;margin-top:1.25rem;flex-wrap:wrap;"></div>
  </div>
</section>

<!-- Before lightbox -->
<div id="abLightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;
     align-items:center;justify-content:center;flex-direction:column;">
  <button id="abLbClose"
    style="position:absolute;top:1rem;right:1.25rem;background:none;border:none;
           color:#fff;font-size:2.5rem;cursor:pointer;line-height:1;">&times;</button>
  <div style="text-align:center;padding:1rem;">
    <p style="color:#aaa;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;">Before</p>
    <img id="abLbImg" src="" alt=""
      style="max-height:80vh;max-width:90vw;border-radius:6px;object-fit:contain;">
  </div>
</div>

<style>
.ab-card {
  cursor: pointer;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}
.ab-card img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  display: block;
  transition: opacity .2s;
}
.ab-card:hover img { opacity: .88; }
.ab-click-hint {
  position: absolute;
  top: .75rem;
  right: .75rem;
  background: rgba(0,0,0,.45);
  color: #fff;
  font-size: .65rem;
  padding: .2rem .55rem;
  border-radius: 20px;
  letter-spacing: .05em;
}
.ab-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ccc;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background .2s;
}
.ab-dot.active { background: #4a2e1a; }
#abLightbox.open { display: flex !important; }
</style>

<script>
(function () {
  const PER_PAGE = 3;

  fetch('/assets/db.json')
    .then(r => { if (!r.ok) throw new Error('db.json ' + r.status); return r.json(); })
    .then(data => {
      const fileSet = new Set(data.files);

      const pairs = data.files
        .filter(f => f.includes('.before.'))
        .map(f => ({ before: f, after: f.replace('.before.', '.after.') }))
        .filter(p => fileSet.has(p.after));

      if (!pairs.length) return;

      const track  = document.getElementById('abTrack');
      const dotsEl = document.getElementById('abDots');
      const total  = Math.ceil(pairs.length / PER_PAGE);
      let current  = 0;

      dotsEl.innerHTML = Array.from({length: total}, (_, i) =>
        `<button class="ab-dot${i === 0 ? ' active' : ''}" data-index="${i}"></button>`
      ).join('');

      function goTo(page) {
        current = (page + total) % total;
        const slice = pairs.slice(current * PER_PAGE, current * PER_PAGE + PER_PAGE);
        track.innerHTML = slice.map((p, i) => `
          <div class="col-lg-4">
            <div class="ab-card" data-index="${current * PER_PAGE + i}">
              <img src="/assets/${p.after}" alt="After" loading="lazy">
              <div class="ab-click-hint">Click for Before</div>
            </div>
          </div>`).join('');
        dotsEl.querySelectorAll('.ab-dot').forEach((d, i) =>
          d.classList.toggle('active', i === current));
      }

      document.getElementById('abPrev').addEventListener('click', () => goTo(current - 1));
      document.getElementById('abNext').addEventListener('click', () => goTo(current + 1));
      dotsEl.querySelectorAll('.ab-dot').forEach(d =>
        d.addEventListener('click', () => goTo(+d.dataset.index)));

      const lightbox = document.getElementById('abLightbox');
      const lbImg    = document.getElementById('abLbImg');

      track.addEventListener('click', e => {
        const card = e.target.closest('.ab-card');
        if (!card) return;
        const p = pairs[+card.dataset.index];
        lbImg.src = `/assets/${p.before}`;
        lbImg.alt = 'Before';
        lightbox.classList.add('open');
      });

      document.getElementById('abLbClose').addEventListener('click', () =>
        lightbox.classList.remove('open'));
      lightbox.addEventListener('click', e => {
        if (e.target === lightbox) lightbox.classList.remove('open');
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') lightbox.classList.remove('open');
        if (!lightbox.classList.contains('open')) {
          if (e.key === 'ArrowLeft')  goTo(current - 1);
          if (e.key === 'ArrowRight') goTo(current + 1);
        }
      });

      goTo(0);
    })
    .catch(err => console.error('[after-before]', err));
})();
</script>
