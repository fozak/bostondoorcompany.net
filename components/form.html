<form id="estimate-form" novalidate>
  <div class="row g-3">
    <div class="col-sm-6">
      <input type="text" name="name" class="form-control form-control-lg" placeholder="Your Name">
    </div>
    <div class="col-sm-6">
      <input type="email" name="email" class="form-control form-control-lg" placeholder="Your Email">
    </div>
    <div class="col-sm-6">
      <input type="tel" name="phone" class="form-control form-control-lg" placeholder="Phone Number">
    </div>
    <div class="col-sm-6">
      <select name="service" class="form-select form-select-lg">
        <option value="">Service Needed</option>
        <option>Adjustment / Weatherization</option>
        <option>Full Restoration</option>
        <option>Hardware Replacement / Locksmith</option>
        <option>Consultation</option>
        <option>Not Sure</option>
      </select>
    </div>
    <div class="col-sm-6">
      <select name="customer_type" class="form-select form-select-lg">
        <option value="">Customer Type</option>
        <option>Owner</option>
        <option>Property Manager</option>
        <option>General Contractor</option>
      </select>
    </div>
    <div class="col-sm-6">
      <select name="building_type" class="form-select form-select-lg">
        <option value="">Building Type</option>
        <option>Residential</option>
        <option>Commercial</option>
      </select>
    </div>
    <div class="col-12">
      <input type="text" name="address" class="form-control form-control-lg" placeholder="Property Address *" required>
      <div class="invalid-feedback">Property address is required.</div>
    </div>
    <div class="col-12">
      <textarea name="message" class="form-control" rows="4" placeholder="Describe your project..."></textarea>
    </div>
    <div class="col-12">
      <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-3">Request a Consultation</button>
    </div>
    <div class="col-12" id="form-msg" style="display:none"></div>
  </div>
</form>

<script>
  document.getElementById('estimate-form').addEventListener('submit', function(e) {
    const address = this.querySelector('[name="address"]');
    if (!address.value.trim()) {
      e.preventDefault();
      address.classList.add('is-invalid');
      address.focus();
    } else {
      address.classList.remove('is-invalid');
    }
  });
  document.querySelector('[name="address"]').addEventListener('input', function() {
    this.classList.remove('is-invalid');
  });
</script>
