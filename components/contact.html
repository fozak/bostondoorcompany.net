<section id="contact">
  <div class="container-xl">
    <div class="row g-5">
      <div class="col-lg-4">
        <h1 class="display-5 text-uppercase mb-4">Schedule <span class="text-primary">a Consultation</span></h1>
        <p class="text-muted mb-4">Licensed and insured door specialists serving Greater Boston. We provide on-site assessments and transparent quotes with no hidden fees.</p>
        <p><i class="fa fa-phone-alt text-primary me-2"></i><a href="tel:6175396365">(617) 539-6365</a></p>
        <p><i class="fa fa-envelope text-primary me-2"></i><a href="mailto:info@bostondoorcompany.net">info@bostondoorcompany.net</a></p>
        <p><i class="fa fa-map-marker-alt text-primary me-2"></i>Boston, MA — serving Greater Boston area</p>
      </div>
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body p-4">
            <div id="new-form">
              <form id="estimate-form">
                <div class="row g-3">

                  <div class="col-sm-6">
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="Name">
                  </div>
                  <div class="col-sm-6">
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="Email">
                  </div>
                  <div class="col-sm-6">
                    <input type="tel" name="phone" class="form-control form-control-lg" placeholder="Phone Number">
                  </div>

                  <div class="col-sm-6">
                    <select name="customer_type" class="form-select form-select-lg">
                      <option value="">Customer Type</option>
                      <option>Homeowner</option>
                      <option>HOA</option>
                      <option>Property Management Company</option>
                      <option>Multi-Unit Building</option>
                      <option>Small Business</option>
                      <option>University / Institution</option>
                      <option>Commercial / Retail</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="col-sm-6">
                    <input type="text" name="company" class="form-control form-control-lg" placeholder="Company / Organization (if applicable)">
                  </div>

                  <div class="col-sm-6">
                    <select name="service" class="form-select form-select-lg">
                      <option value="">Service Needed</option>
                      <option>Door Repair</option>
                      <option>Door Installation</option>
                      <option>Door Restoration &amp; Refinishing</option>
                      <option>Hardware &amp; Locks</option>
                      <option>Specialty Locksmith</option>
                      <option>Weatherproofing</option>
                      <option>Finish Carpentry</option>
                      <option>Consulting</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="col-sm-6">
                    <select name="building_type" class="form-select form-select-lg">
                      <option value="">Building Type</option>
                      <option>Residential</option>
                      <option>Commercial Storefront</option>
                      <option>Commercial Office</option>
                      <option>Industrial</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <input type="text" name="address" class="form-control form-control-lg" placeholder="Project Address (e.g. 123 Main St, Boston, MA)">
                  </div>

                  <div class="col-12">
                    <textarea name="message" class="form-control" rows="4" placeholder="Describe your door project..."></textarea>
                  </div>

                  <div class="col-12">
                    <label class="form-label text-muted small mb-1">
                      <i class="fa fa-camera text-primary me-1"></i>Photo of your door (optional)
                    </label>
                    <input type="file" name="photo" id="photo-input" class="form-control form-control-lg" accept="image/*">
                  </div>

                  <div class="col-12">
                    <button type="submit" id="submit-btn" class="btn btn-primary w-100 py-3">Submit contact form</button>
                  </div>
                  <div class="alert alert-success" id="form-msg" style="display:none;">Thank you! We'll be in touch shortly.</div>

                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
