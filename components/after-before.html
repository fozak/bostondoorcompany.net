<section id="after-before" class="section-bg py-6">
  <div class="container-xl">
    <div class="text-center mb-5">
      <h1 class="display-5 text-uppercase">Before <span class="text-primary">&amp; After</span></h1>
      <p class="text-muted">Click any photo to flip and see the before.</p>
    </div>

    <div style="position:relative;">
      <div id="abTrack" class="row g-4"></div>
      <button id="abPrev" aria-label="Previous"
        style="position:absolute;top:50%;left:-20px;transform:translateY(-50%);z-index:10;
               width:44px;height:44px;border-radius:50%;border:none;background:#fff;
               box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:1.4rem;">&#8249;</button>
      <button id="abNext" aria-label="Next"
        style="position:absolute;top:50%;right:-20px;transform:translateY(-50%);z-index:10;
               width:44px;height:44px;border-radius:50%;border:none;background:#fff;
               box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;font-size:1.4rem;">&#8250;</button>
    </div>

    <div id="abDots" style="display:flex;justify-content:center;gap:6px;margin-top:1.25rem;flex-wrap:wrap;"></div>
  </div>
</section>

<style>
.ab-flip {
  cursor: pointer;
  border-radius: 8px;
  perspective: 1200px;
  aspect-ratio: 3/4;
}
.ab-flip-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.72s cubic-bezier(0.4, 0.2, 0.2, 1);
  border-radius: 8px;
}
.ab-flip.flipped .ab-flip-inner {
  transform: rotateY(180deg);
}
.ab-flip-front,
.ab-flip-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 8px;
  overflow: hidden;
}
.ab-flip-back {
  transform: rotateY(180deg);
}
.ab-flip img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}
.ab-flip:hover img { transform: scale(1.03); }
.ab-badge {
  position: absolute;
  top: .75rem;
  right: .75rem;
  background: rgba(0,0,0,.52);
  color: #fff;
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: .2rem .55rem;
  border-radius: 20px;
  pointer-events: none;
  z-index: 2;
}
.ab-hint {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.52));
  color: #fff;
  font-size: .72rem;
  text-align: center;
  padding: 28px 8px 10px;
  pointer-events: none;
  z-index: 2;
  letter-spacing: .05em;
  transition: opacity .25s;
}
.ab-flip.flipped .ab-hint { opacity: 0; }
.ab-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ccc;
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background .2s;
}
.ab-dot.active { background: #4a2e1a; }
</style>

<script>
(function () {
  const PER_PAGE = 3;

  fetch('/assets/db.json')
    .then(r => { if (!r.ok) throw new Error('db.json ' + r.status); return r.json(); })
    .then(data => {
      const fileSet = new Set(data.files);

      const pairs = data.files
        .filter(f => f.includes('.before.'))
        .map(f => ({ before: f, after: f.replace('.before.', '.after.') }))
        .filter(p => fileSet.has(p.after));

      if (!pairs.length) return;

      const track  = document.getElementById('abTrack');
      const dotsEl = document.getElementById('abDots');
      const total  = Math.ceil(pairs.length / PER_PAGE);
      let current  = 0;

      dotsEl.innerHTML = Array.from({length: total}, (_, i) =>
        `<button class="ab-dot${i === 0 ? ' active' : ''}" data-index="${i}"></button>`
      ).join('');

      function goTo(page) {
        current = (page + total) % total;
        const slice = pairs.slice(current * PER_PAGE, current * PER_PAGE + PER_PAGE);

        track.innerHTML = slice.map((p, i) => `
          <div class="col-lg-4">
            <div class="ab-flip" data-index="${current * PER_PAGE + i}">
              <div class="ab-flip-inner">
                <div class="ab-flip-front">
                  <img src="/assets/${p.after}" alt="After" loading="lazy">
                  <span class="ab-badge">After</span>
                  <div class="ab-hint">Click to see Before</div>
                </div>
                <div class="ab-flip-back">
                  <img src="/assets/${p.before}" alt="Before" loading="lazy">
                  <span class="ab-badge">Before</span>
                </div>
              </div>
            </div>
          </div>`).join('');

        track.querySelectorAll('.ab-flip').forEach(card => {
          card.addEventListener('click', () => card.classList.toggle('flipped'));
        });

        dotsEl.querySelectorAll('.ab-dot').forEach((d, i) =>
          d.classList.toggle('active', i === current));
      }

      document.getElementById('abPrev').addEventListener('click', () => goTo(current - 1));
      document.getElementById('abNext').addEventListener('click', () => goTo(current + 1));
      dotsEl.querySelectorAll('.ab-dot').forEach(d =>
        d.addEventListener('click', () => goTo(+d.dataset.index)));

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  goTo(current - 1);
        if (e.key === 'ArrowRight') goTo(current + 1);
      });

      goTo(0);
    })
    .catch(err => console.error('[after-before]', err));
})();
</script>
